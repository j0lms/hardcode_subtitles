name: Build and Release Executables

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: hardcode-subtitles-windows-x64.zip
            asset_path: hardcode-subtitles-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: hardcode-subtitles-linux-x64.tar.gz
            asset_path: hardcode-subtitles-linux-x64.tar.gz
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pip

      - name: Build Executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: run.py
          mode: standalone
          enable-plugins: tk-inter
          include-package-data: tkinterdnd2

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Rename-Item -Path build/run.dist -NewName hardcode-subtitles
          Compress-Archive -Path build/hardcode-subtitles -DestinationPath hardcode-subtitles-windows-x64.zip

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mv build/run.dist build/hardcode-subtitles
          tar -czvf hardcode-subtitles-linux-x64.tar.gz -C build hardcode-subtitles

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="v1"
          fi

          echo "Target release tag: ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release '${TAG}' exists. Overwriting assets..."
            gh release upload "${TAG}" release-assets/* --clobber
          else
            echo "Release '${TAG}' does not exist. Creating release and uploading assets..."
            gh release create "${TAG}" release-assets/* \
              --title "Release ${TAG}" \
              --notes "Standalone multiplatform executables for Windows and Linux."
          fi

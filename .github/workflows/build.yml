name: Build and Release Executables

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: hardcode-subtitles-windows-x64.zip
            asset_path: hardcode-subtitles-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: hardcode-subtitles-linux-x64.tar.gz
            asset_path: hardcode-subtitles-linux-x64.tar.gz
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pip

      - name: Build Executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: run.py
          mode: standalone
          enable-plugins: tk-inter
          include-package-data: tkinterdnd2

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Rename-Item -Path build/run.dist -NewName hardcode-subtitles
          Compress-Archive -Path build/hardcode-subtitles -DestinationPath hardcode-subtitles-windows-x64.zip

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mv build/run.dist build/hardcode-subtitles
          tar -czvf hardcode-subtitles-linux-x64.tar.gz -C build hardcode-subtitles

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
